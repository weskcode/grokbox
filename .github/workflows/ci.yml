name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # FoundationModels needs the macOS 26 SDK, which ships with Xcode 26 on the
    # macos-26 image. macos-15 tops out at Xcode 16 and cannot build this.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No Xcode 26 on this image:"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$X" && xcodebuild -version
      - name: Core tests
        run: cd GrokboxCore && swift test
      - name: App build
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Grokbox.xcodeproj -scheme Grokbox -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
      - name: iOS build
        run: |
          xcodebuild -project Grokbox.xcodeproj -scheme GrokboxiOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" CODE_SIGNING_ALLOWED=NO build
      - name: iOS UI tests
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[v['udid'] for rt,vs in d.items() for v in vs if v['name'].startswith('iPhone')]; print(c[0] if c else '')")
          test -n "$DEST" || { echo 'no iPhone simulator on this runner'; exit 1; }
          xcodebuild test -project Grokbox.xcodeproj -scheme GrokboxiOS -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGNING_ALLOWED=NO -only-testing:GrokboxiOSUITests
